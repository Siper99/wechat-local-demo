name: Build iPhone IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build unsigned personal IPA
        run: bash scripts/build-ipa.sh
      - name: Upload IPA for local signing
        uses: actions/upload-artifact@v4
        with:
          name: WeChat-Simulator-unsigned
          path: build/WeChat-Simulator-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
