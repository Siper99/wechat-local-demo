name: QingLiao
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""          # 在这里填你的 Team ID，或在 Xcode 的 Signing 里选
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "4"
    TARGETED_DEVICE_FAMILY: "1"
    QINGLIAO_BUNDLE_ID: com.example.qingliao
    APP_GROUP_IDENTIFIER: group.$(QINGLIAO_BUNDLE_ID)

targets:
  QingLiao:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QINGLIAO_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WeChat
        INFOPLIST_KEY_QingLiaoAppGroup: $(APP_GROUP_IDENTIFIER)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: 拍摄照片并添加到本地聊天
        INFOPLIST_KEY_UIDesignRequiresCompatibility: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    entitlements:
      path: App/QingLiao.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    dependencies:
      - target: QingLiaoShare

  QingLiaoShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QINGLIAO_BUNDLE_ID).share
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WeChat
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: WeChat
        QingLiaoAppGroup: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 9
    entitlements:
      path: ShareExtension/QingLiaoShare.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
