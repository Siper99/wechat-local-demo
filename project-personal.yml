# 免费 Apple 账号 / SideStore / AltStore 安装：不嵌入分享扩展，不申请 App Groups。
name: QingLiaoPersonal
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "3"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  QingLiao:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "*.entitlements"
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.qingliao.personal
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WeChat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: 拍摄照片并添加到本地聊天
        INFOPLIST_KEY_UIDesignRequiresCompatibility: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  QingLiaoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: QingLiao
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.qingliao.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  QingLiao:
    build:
      targets:
        QingLiao: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - QingLiaoUITests
